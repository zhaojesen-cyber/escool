name: Website checks
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
        env:
          SITE_URL: https://escool.id
      - uses: actions/upload-artifact@v4
        with:
          name: soocool-static-site
          path: dist/
          retention-days: 7
